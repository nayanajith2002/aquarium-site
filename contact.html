<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Nature Scapes</title>
    
<link rel="stylesheet" href="contact-style.css">

</head>
<a href="https://wa.me/94723209245" class="whatsapp-float" target="_blank">
    <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" alt="WhatsApp" />
    <span>Chat with us</span>
</a>
<body>

    <div class="main-container">
        <div class="contact-info">
            <h1>Contact Us</h1>
            <p style="margin-bottom: 30px;">අප හා සම්බන්ධ වීමට පහත තොරතුරු භාවිතා කරන්න.</p>

            <div class="info-item">
                <h3>📞 Call Us</h3>
                <p>+94 11 234 5678<br>+94 77 123 4567</p>
            </div>

            <div class="info-item">
                <h3>📍 Location</h3>
                <p>123 Nature Scapes, Aquascape Street,<br>Moratuwa, Sri Lanka.</p>
            </div>

            <div class="info-item">
                <h3>🕒 Business Hours</h3>
                <p>Mon - Fri: 9 am - 6 pm<br>Sat - Sun: Closed</p>
            </div>
            
            <a href="index.html" class="back-home">⬅ Back to Home</a>
        </div>

        <div class="contact-form">
            <form>
                <div class="input-row">
                    <div class="input-group">
                        <label>Email</label>
                        <input type="email" placeholder="Enter a valid email" required>
                    </div>
                    <div class="input-group">
                        <label>Name</label>
                        <input type="text" placeholder="Enter your Name" required>
                    </div>
                </div>

                <div class="input-group">
                    <label>Address</label>
                    <input type="text" placeholder="Enter your address">
                </div>

                <div class="input-group">
                    <label>Message</label>
                    <textarea rows="3" placeholder="Enter your message" required></textarea>
                </div>

                <button type="submit" class="submit-btn">SUBMIT</button>
            </form>
        </div>
    </div>

</body>
</html>
